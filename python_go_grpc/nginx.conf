pid /tmp/devops-nginx.pid;
error_log /dev/stderr info;
events { worker_connections 1024; }
http {
 access_log /dev/stdout;
 upstream grpcservers { server 127.0.0.1:50051; }
 server {
  listen 127.0.0.1:9448 ssl http2;
  ssl_certificate /app/certs/server.pem;
  ssl_certificate_key /app/certs/server-key.pem;
  ssl_client_certificate /app/certs/ca.pem;
  ssl_verify_client on;
  ssl_protocols TLSv1.2 TLSv1.3;
  location / { grpc_pass grpc://grpcservers; }
  location /nginx_status { stub_status on; allow 127.0.0.1; deny all; }
 }
}
